name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish all-in-one Windows executable
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag belongs to main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in main."
          }

      - name: Verify tag matches centralized version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $version = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props does not define KnolTeacherVersion."
          }

          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match centralized version '$expectedTag'."
          }

      - name: Restore
        run: dotnet restore KnolTeacher.sln

      - name: Build
        run: dotnet build KnolTeacher.sln -c Release --no-restore

      - name: Build all-in-one package
        shell: cmd
        run: publish.bat

      - name: Verify release asset and embedded version
        shell: pwsh
        run: |
          $releaseAsset = "dist-net/놀티쳐.exe"
          if (-not (Test-Path -LiteralPath $releaseAsset)) {
            throw "Missing release asset: $releaseAsset"
          }

          $files = @(Get-ChildItem -LiteralPath "dist-net" -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne "놀티쳐.exe") {
            throw "Release output must contain exactly one file: 놀티쳐.exe"
          }

          [xml]$props = Get-Content "Directory.Build.props"
          $expectedVersion = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          $embeddedVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $releaseAsset)).FileVersion
          if ([string]::IsNullOrWhiteSpace($embeddedVersion)) {
            throw "Release executable has no embedded FileVersion."
          }

          $embeddedCore = ([version]$embeddedVersion)
          $embeddedSemVer = "$($embeddedCore.Major).$($embeddedCore.Minor).$($embeddedCore.Build)"
          if ($embeddedSemVer -ne $expectedVersion) {
            throw "Embedded executable version '$embeddedSemVer' does not match centralized version '$expectedVersion'."
          }

          $hash = (Get-FileHash -LiteralPath $releaseAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Release version: $embeddedSemVer"
          Write-Host "Release SHA-256: $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "dist-net/놀티쳐.exe" `
            --verify-tag `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
