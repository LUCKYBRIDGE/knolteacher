name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "release/release-version.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish all-in-one Windows executable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve and verify release version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $centralVersion = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          if ([string]::IsNullOrWhiteSpace($centralVersion)) {
            throw "Directory.Build.props does not define KnolTeacherVersion."
          }

          $centralTag = "v$centralVersion"
          $isTagRun = $env:GITHUB_REF_TYPE -eq "tag"

          if ($isTagRun) {
            if ($env:GITHUB_REF_NAME -ne $centralTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match centralized version '$centralTag'."
            }
            $releaseTag = $env:GITHUB_REF_NAME
          }
          else {
            if (-not (Test-Path -LiteralPath "release/release-version.txt")) {
              throw "release/release-version.txt is required for promotion releases."
            }

            $promoteVersion = (Get-Content -LiteralPath "release/release-version.txt" -Raw).Trim()
            if ($promoteVersion -ne $centralVersion) {
              throw "Promotion version '$promoteVersion' does not match centralized version '$centralVersion'."
            }
            $releaseTag = $centralTag
          }

          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release workflow commits must be contained in main."
          }

          $existingTagCommit = $null
          git rev-parse --verify --quiet "refs/tags/$releaseTag" *> $null
          $tagLookupExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($tagLookupExitCode -eq 0) {
            $existingTagCommit = (git rev-list -n 1 $releaseTag).Trim()
            git merge-base --is-ancestor $existingTagCommit origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Existing tag '$releaseTag' does not point to a commit contained in main."
            }
            $releaseCommit = $existingTagCommit
          }
          elseif ($tagLookupExitCode -eq 1) {
            $releaseCommit = $env:GITHUB_SHA
          }
          else {
            throw "Unable to determine whether tag '$releaseTag' exists. git exit code: $tagLookupExitCode"
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$centralVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_COMMIT=$releaseCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAG_ALREADY_EXISTS=$([bool]$existingTagCommit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Release version: $centralVersion"
          Write-Host "Release tag    : $releaseTag"
          Write-Host "Release commit : $releaseCommit"
          Write-Host "Tag exists     : $([bool]$existingTagCommit)"

      - name: Checkout exact release commit
        shell: pwsh
        run: |
          git checkout --detach "$env:RELEASE_COMMIT"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to checkout release commit '$env:RELEASE_COMMIT'."
          }

          [xml]$props = Get-Content "Directory.Build.props"
          $checkedVersion = [string]$props.Project.PropertyGroup.KnolTeacherVersion
          if ($checkedVersion -ne $env:RELEASE_VERSION) {
            throw "Release commit version '$checkedVersion' does not match '$env:RELEASE_VERSION'."
          }

      - name: Restore
        run: dotnet restore KnolTeacher.sln

      - name: Build
        run: dotnet build KnolTeacher.sln -c Release --no-restore

      - name: Test
        run: dotnet test KnolTeacher.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Build all-in-one package
        shell: cmd
        run: publish.bat

      - name: Verify release asset and embedded version
        shell: pwsh
        run: |
          $releaseAsset = "dist-net/놀티쳐.exe"
          if (-not (Test-Path -LiteralPath $releaseAsset)) {
            throw "Missing release asset: $releaseAsset"
          }

          $files = @(Get-ChildItem -LiteralPath "dist-net" -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne "놀티쳐.exe") {
            throw "Release output must contain exactly one file: 놀티쳐.exe"
          }

          $embeddedVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $releaseAsset)).FileVersion
          if ([string]::IsNullOrWhiteSpace($embeddedVersion)) {
            throw "Release executable has no embedded FileVersion."
          }

          $embeddedCore = [version]$embeddedVersion
          $embeddedSemVer = "$($embeddedCore.Major).$($embeddedCore.Minor).$($embeddedCore.Build)"
          if ($embeddedSemVer -ne $env:RELEASE_VERSION) {
            throw "Embedded executable version '$embeddedSemVer' does not match release version '$env:RELEASE_VERSION'."
          }

          $hash = (Get-FileHash -LiteralPath $releaseAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Release SHA-256: $hash"
          "RELEASE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release tag when promoted from main
        if: env.TAG_ALREADY_EXISTS != 'True'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$env:RELEASE_TAG" "$env:RELEASE_COMMIT" -m "KnolTeacher $env:RELEASE_TAG"
          git push origin "$env:RELEASE_TAG"

      - name: Create or reuse draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $allReleases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list GitHub Releases."
          }

          $matches = @($allReleases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          if ($matches.Count -gt 1) {
            throw "Multiple releases found for '$env:RELEASE_TAG'."
          }

          if ($matches.Count -eq 0) {
            gh release create "$env:RELEASE_TAG" `
              --verify-tag `
              --title "$env:RELEASE_TAG" `
              --generate-notes `
              --notes "SHA-256: $env:RELEASE_SHA256" `
              --draft
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create draft GitHub Release '$env:RELEASE_TAG'."
            }

            $allReleases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
            $matches = @($allReleases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          }

          if ($matches.Count -ne 1 -or $null -eq $matches[0].id) {
            throw "Unable to resolve release ID for '$env:RELEASE_TAG'."
          }

          $release = $matches[0]
          "RELEASE_ID=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release ID: $($release.id), draft=$($release.draft)"

      - name: Upload and normalize release asset name
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAsset = (Resolve-Path -LiteralPath "dist-net/놀티쳐.exe").Path
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $releaseJson.id) {
            throw "Unable to resolve release ID '$env:RELEASE_ID'."
          }

          foreach ($asset in @($releaseJson.assets)) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to remove stale release asset '$($asset.name)'."
            }
          }

          # Upload with an ASCII transport name. Some Windows/PowerShell upload paths
          # were normalized by GitHub to default.exe when a Korean query name was used.
          $uploadUri = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=knolteacher.exe"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $uploadResponse = Invoke-RestMethod `
            -Uri $uploadUri `
            -Method Post `
            -Headers $headers `
            -ContentType "application/octet-stream" `
            -InFile $releaseAsset

          if ($null -eq $uploadResponse.id) {
            throw "GitHub did not return an asset id after upload."
          }

          # Rename metadata after upload. The binary is unchanged; only the GitHub
          # asset display/download name is normalized to the updater contract.
          $renamePayload = @{ name = "놀티쳐.exe"; label = "놀티쳐 Windows x64 올인원" } | ConvertTo-Json -Compress
          $renamePayload | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($uploadResponse.id)" --input - | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to rename release asset to '놀티쳐.exe'."
          }

          $verifiedRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify uploaded release asset."
          }

          $assets = @($verifiedRelease.assets)
          if ($assets.Count -ne 1) {
            throw "Release must contain exactly one asset; found $($assets.Count)."
          }

          $uploaded = $assets[0]
          if ($uploaded.name -ne "놀티쳐.exe") {
            throw "Release asset name must be exactly '놀티쳐.exe'; found '$($uploaded.name)'."
          }

          $expectedDigest = "sha256:$env:RELEASE_SHA256"
          if (-not [string]::IsNullOrWhiteSpace([string]$uploaded.digest) -and $uploaded.digest -ne $expectedDigest) {
            throw "Release asset digest '$($uploaded.digest)' does not match '$expectedDigest'."
          }

          $localLength = (Get-Item -LiteralPath $releaseAsset).Length
          if ([long]$uploaded.size -ne $localLength) {
            throw "Release asset size '$($uploaded.size)' does not match local file size '$localLength'."
          }

          Write-Host "Verified release asset: $($uploaded.name)"
          Write-Host "Verified release SHA-256: $env:RELEASE_SHA256"

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $payload = @{ draft = $false; prerelease = $false } | ConvertTo-Json -Compress
          $payload | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --input - | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish verified release '$env:RELEASE_TAG'."
          }

          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -eq $true -or $published.prerelease -eq $true) {
            throw "Release '$env:RELEASE_TAG' was not published as a stable release."
          }

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne $env:RELEASE_TAG) {
            throw "Latest stable release is not '$env:RELEASE_TAG'."
          }

          $assets = @($latest.assets)
          if ($assets.Count -ne 1 -or $assets[0].name -ne "놀티쳐.exe") {
            throw "Latest stable release must expose exactly one asset named '놀티쳐.exe'."
          }

          Write-Host "Published stable release: $env:RELEASE_TAG"
